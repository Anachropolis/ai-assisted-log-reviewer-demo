[build-system]
# Needed tools
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-log-reviewer"
version = "0.1.0"
description = "AI-assisted operator log review demo using RAG and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Adam Herston"}
]
dependencies = [
    "requests>=2.28.0",
    "fastapi",
    "uvicorn",
    "openai",
    "python-dotenv",
    "chromadb",
    "pydantic",
    "langchain-text-splitters",
    "streamlit"
]

[project.optional-dependencies]
# For users who want to run tests or dev tools
dev = ["pytest", "black"]

[tool.setuptools.packages.find]
where = ["src"]



